<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>LOUD · 3D</title>
  </head>
  <body>
    <div id="app"></div>

    <header class="brand">
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <b>LOUD</b>
      <div class="lang">
        <button id="lang-es">ES</button><button id="lang-en">EN</button>
      </div>
    </header>

    <button id="panel-toggle" aria-label="Menu">☰</button>
    <aside id="panel" class="open">
      <section>
        <h3 data-t="floors"></h3>
        <div id="floors" class="seg"></div>
      </section>
      <section>
        <h3 data-t="explode"></h3>
        <input id="explode" type="range" min="0" max="8" step="0.1" value="0" />
      </section>
      <section class="toggles">
        <label><input id="zones" type="checkbox" /> <span data-t="zones"></span></label>
        <label><input id="lights" type="checkbox" checked /> <span data-t="lights"></span></label>
        <label><input id="context" type="checkbox" checked /> <span data-t="context"></span></label>
      </section>
      <section>
        <h3 data-t="points"></h3>
        <div id="hs-list" class="list"></div>
      </section>
      <button id="reset" data-t="reset"></button>
      <p class="hint" data-t="hint"></p>
    </aside>

    <div id="legend" hidden></div>

    <div id="card" hidden>
      <button id="card-close" aria-label="Close">×</button>
      <h2 id="card-title"></h2>
      <p id="card-body"></p>
    </div>

    <div id="loader">
      <div class="logo">LOUD</div>
      <div class="track"><div id="bar"></div></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
